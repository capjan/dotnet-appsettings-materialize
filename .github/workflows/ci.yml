name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AppSettings.Materializer.sln
      - run: dotnet build AppSettings.Materializer.sln --configuration Release --no-restore
      - run: dotnet test AppSettings.Materializer.sln --configuration Release --no-build -m:1

  package-and-smoke-test:
    name: Pack and smoke-test global tool
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AppSettings.Materializer.sln
      - run: dotnet build AppSettings.Materializer.sln --configuration Release --no-restore
      - run: dotnet pack src/AppSettings.Materializer.Cli/AppSettings.Materializer.Cli.csproj --configuration Release --no-build -p:Version=1.0.0 -o ./artifacts
      - run: dotnet tool install --global dotnet-appsettings-materialize --version 1.0.0 --source ./artifacts
      - run: appsettings-materialize --help
      - run: appsettings-materialize merge --directory ./samples/stage --environment Stage --output ./artifacts/stage.effective.json
