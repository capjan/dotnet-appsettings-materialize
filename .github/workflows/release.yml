name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Determine version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore AppSettings.Materializer.sln
      - run: dotnet build AppSettings.Materializer.sln --configuration Release --no-restore -p:Version="$VERSION"
      - run: dotnet test AppSettings.Materializer.sln --configuration Release --no-build -m:1
      - run: dotnet pack src/AppSettings.Materializer.Cli/AppSettings.Materializer.Cli.csproj --configuration Release --no-build -p:Version="$VERSION" -o ./artifacts
      - name: Verify packaged assembly versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-ChildItem ./artifacts/*.nupkg | Select-Object -First 1
          $extractDirectory = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $extractDirectory | Out-Null
          unzip -q "$($package.FullName)" -d "$extractDirectory"

          $assemblyFile = Get-ChildItem "$extractDirectory/tools" -Filter "AppSettings.Materializer.Cli.dll" -Recurse | Select-Object -First 1
          if ($null -eq $assemblyFile) {
            throw "Packaged CLI assembly was not found."
          }

          $assembly = [System.Reflection.Assembly]::LoadFile($assemblyFile.FullName)
          $fileVersion = $assembly.GetCustomAttributes([System.Reflection.AssemblyFileVersionAttribute], $false)[0].Version
          $informationalVersion = $assembly.GetCustomAttributes([System.Reflection.AssemblyInformationalVersionAttribute], $false)[0].InformationalVersion
          $fileVersionBase = ($env:VERSION -split '[-+]')[0]
          $expectedFileVersion = "$fileVersionBase.0"

          if ($fileVersion -ne $expectedFileVersion) {
            throw "Expected AssemblyFileVersion $expectedFileVersion, found $fileVersion."
          }

          if ($informationalVersion -ne $env:VERSION -and -not $informationalVersion.StartsWith($env:VERSION + "+", [System.StringComparison]::Ordinal)) {
            throw "Expected AssemblyInformationalVersion to start with $env:VERSION, found $informationalVersion."
          }
      - name: NuGet login (OIDC to temporary key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: capjan
      - name: Publish package to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg --generate-notes --verify-tag
